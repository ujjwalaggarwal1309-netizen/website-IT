<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Enterprise IT hardware infrastructure illustration">
  <title>Enterprise IT Hardware Infrastructure</title>
  <!--
    hero-illustration.svg
    Displayed in the hero section right column on homepage
    Background: navy gradient (set by hero section CSS)
    Colors: white semi-transparent + orange accents
    Source: Phase 2 brand assets / WEBSITE_DESIGN_SPEC.md
  -->

  <!-- Glow rings (decorative background) -->
  <circle cx="260" cy="210" r="195" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.05"/>
  <circle cx="260" cy="210" r="155" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.06"/>
  <circle cx="260" cy="210" r="110" fill="rgba(255,255,255,0.03)"/>

  <!-- ── Main Server Rack Unit ───────────────────────────── -->
  <rect x="95" y="54" width="248" height="312" rx="18" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Rack top bezel -->
  <rect x="95" y="54" width="248" height="22" rx="18" fill="rgba(255,255,255,0.1)"/>
  <circle cx="116" cy="65" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="128" cy="65" r="3" fill="#F58220"/>
  <circle cx="140" cy="65" r="3" fill="rgba(255,255,255,0.3)"/>

  <!-- ── Server Unit 1 ───────────────────────────────────── -->
  <rect x="111" y="88" width="216" height="42" rx="7" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <!-- Drive bays -->
  <rect x="123" y="98" width="110" height="14" rx="4" fill="rgba(255,255,255,0.08)"/>
  <!-- LEDs -->
  <circle cx="306" cy="105" r="4" fill="#F58220"/>
  <circle cx="318" cy="105" r="4" fill="#F58220" fill-opacity="0.55"/>
  <circle cx="306" cy="118" r="4" fill="rgba(255,255,255,0.0)"/>
  <!-- Power button -->
  <circle cx="308" cy="109" r="0" fill="none"/>
  <rect x="309" y="97" width="12" height="26" rx="3" fill="rgba(255,255,255,0.07)"/>

  <!-- ── Server Unit 2 ───────────────────────────────────── -->
  <rect x="111" y="140" width="216" height="42" rx="7" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="123" y="150" width="80" height="14" rx="4" fill="rgba(255,255,255,0.07)"/>
  <rect x="210" y="150" width="40" height="14" rx="4" fill="rgba(255,255,255,0.07)"/>
  <circle cx="306" cy="157" r="4" fill="rgba(255,255,255,0.5)"/>
  <circle cx="318" cy="157" r="4" fill="rgba(255,255,255,0.3)"/>
  <rect x="309" y="149" width="12" height="26" rx="3" fill="rgba(255,255,255,0.06)"/>

