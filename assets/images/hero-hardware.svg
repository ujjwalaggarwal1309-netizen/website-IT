  <line x1="128" y1="268" x2="162" y2="268" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="128" y1="274" x2="155" y2="274" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="178" y1="268" x2="212" y2="268" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="178" y1="274" x2="205" y2="274" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="228" y1="268" x2="262" y2="268" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="134" cy="284" r="3" fill="#F58220" fill-opacity="0.7"/>
  <circle cx="184" cy="284" r="3" fill="rgba(255,255,255,0.4)"/>
  <circle cx="234" cy="284" r="3" fill="rgba(255,255,255,0.4)"/>

