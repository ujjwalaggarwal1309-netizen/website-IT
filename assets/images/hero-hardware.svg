  <!-- 4 drive bays -->
  <rect x="123" y="256" width="44" height="36" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="173" y="256" width="44" height="36" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="223" y="256" width="44" height="36" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="273" y="256" width="44" height="36" rx="5" fill="rgba(255,255,255,0.05)"/>
