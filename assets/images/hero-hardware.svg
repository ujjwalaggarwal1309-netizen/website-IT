  <rect x="111" y="192" width="216" height="42" rx="7" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <rect x="123" y="202" width="130" height="14" rx="4" fill="rgba(255,255,255,0.08)"/>
  <circle cx="306" cy="209" r="4" fill="#F58220" fill-opacity="0.7"/>
  <circle cx="318" cy="209" r="4" fill="rgba(255,255,255,0.3)"/>
  <rect x="309" y="201" width="12" height="26" rx="3" fill="rgba(255,255,255,0.06)"/>

