  <rect x="111" y="314" width="216" height="30" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="123" y="323" width="60" height="8" rx="3" fill="rgba(255,255,255,0.07)"/>
  <circle cx="306" cy="329" r="3" fill="#F58220" fill-opacity="0.4"/>
  <circle cx="316" cy="329" r="3" fill="rgba(255,255,255,0.2)"/>

  <!-- ── Right network connection lines ─────────────────── -->
  <path d="M343 109 Q390 109 410 80" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" stroke-dasharray="5,4"/>
  <circle cx="410" cy="80" r="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="410" cy="80" r="3" fill="rgba(255,255,255,0.4)"/>

  <path d="M343 161 Q390 161 420 150" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" stroke-dasharray="5,4"/>
  <circle cx="420" cy="150" r="7" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <circle cx="420" cy="150" r="2.5" fill="rgba(255,255,255,0.35)"/>

  <path d="M343 213 Q395 213 430 240" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" stroke-dasharray="5,4"/>
  <circle cx="430" cy="240" r="7" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <circle cx="430" cy="240" r="2.5" fill="#F58220" fill-opacity="0.5"/>

  <!-- ── Left connection lines ───────────────────────────── -->
  <path d="M95 130 Q60 130 45 105" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" stroke-dasharray="5,4"/>
  <circle cx="45" cy="105" r="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <circle cx="45" cy="105" r="3" fill="rgba(255,255,255,0.35)"/>

  <path d="M95 200 Q55 200 40 230" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" fill="none" stroke-dasharray="5,4"/>
  <circle cx="40" cy="230" r="7" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="40" cy="230" r="2.5" fill="rgba(255,255,255,0.3)"/>

  <!-- ── Floating data particles ────────────────────────── -->
  <circle cx="460" cy="300" r="5" fill="#F58220" fill-opacity="0.5"/>
  <circle cx="472" cy="278" r="3.5" fill="#F58220" fill-opacity="0.35"/>
  <circle cx="455" cy="262" r="2.5" fill="#F58220" fill-opacity="0.25"/>
  <circle cx="468" cy="255" r="2" fill="#F58220" fill-opacity="0.2"/>

  <circle cx="30" cy="310" r="4.5" fill="#F58220" fill-opacity="0.4"/>
  <circle cx="18" cy="290" r="3" fill="#F58220" fill-opacity="0.28"/>
  <circle cx="35" cy="278" r="2" fill="#F58220" fill-opacity="0.2"/>

  <!-- Bottom rack shadow/base -->
  <rect x="115" y="378" width="208" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="130" y="382" width="178" height="2" rx="1" fill="rgba(255,255,255,0.05)"/>
</svg>