<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-label="IT infrastructure and professional support illustration">
  <title>IT Infrastructure Solutions</title>
  <!--
    about-image.svg
    Displayed in the About Us page — image column
    Represents: Professional IT infrastructure management
    Colors: brand palette — navy, blue, orange
    Source: Phase 2 brand assets / WEBSITE_DESIGN_SPEC.md
  -->

  <!-- Background rounded card -->
  <rect width="480" height="380" rx="24" fill="#F0F4FF"/>

  <!-- ── Main monitor / display ──────────────────────────── -->
  <rect x="80" y="40" width="320" height="200" rx="14" fill="#0D2665"/>
  <rect x="94" y="54" width="292" height="172" rx="8" fill="#1B4DDB" fill-opacity="0.3"/>
  <!-- Screen content — dashboard bars -->
  <rect x="108" y="70" width="80" height="10" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="108" y="86" width="200" height="6" rx="3" fill="rgba(255,255,255,0.08)"/>

  <!-- Bar chart on screen -->
  <rect x="108" y="116" width="18" height="70" rx="4" fill="#F58220" fill-opacity="0.8"/>
  <rect x="134" y="136" width="18" height="50" rx="4" fill="rgba(255,255,255,0.4)"/>
  <rect x="160" y="126" width="18" height="60" rx="4" fill="#F58220" fill-opacity="0.6"/>
  <rect x="186" y="140" width="18" height="46" rx="4" fill="rgba(255,255,255,0.35)"/>
  <rect x="212" y="118" width="18" height="68" rx="4" fill="#F58220" fill-opacity="0.9"/>
  <rect x="238" y="132" width="18" height="54" rx="4" fill="rgba(255,255,255,0.4)"/>

  <!-- Stat numbers on screen right -->
  <rect x="276" y="96" width="100" height="40" rx="8" fill="rgba(255,255,255,0.08)"/>
  <rect x="284" y="102" width="40" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="284" y="114" width="60" height="14" rx="4" fill="#F58220" fill-opacity="0.5"/>
  <rect x="276" y="148" width="100" height="40" rx="8" fill="rgba(255,255,255,0.08)"/>
  <rect x="284" y="154" width="40" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="284" y="166" width="50" height="14" rx="4" fill="rgba(255,255,255,0.3)"/>

  <!-- Monitor stand -->
  <rect x="210" y="240" width="60" height="12" rx="4" fill="#CBD5E1"/>
  <rect x="185" y="252" width="110" height="10" rx="5" fill="#94A3B8"/>

  <!-- ── Server unit (bottom left) ──────────────────────── -->
  <rect x="36" y="272" width="130" height="80" rx="10" fill="#E8F0FE"/>
  <rect x="36" y="272" width="130" height="24" rx="10" fill="#0D2665"/>
  <circle cx="52" cy="284" r="4" fill="#F58220"/>
  <circle cx="64" cy="284" r="4" fill="rgba(255,255,255,0.3)"/>
  <rect x="80" y="280" width="50" height="8" rx="3" fill="rgba(255,255,255,0.15)"/>

  <rect x="48" y="305" width="102" height="8" rx="3" fill="#CBD5E1"/>
  <rect x="48" y="319" width="80" height="8" rx="3" fill="#CBD5E1"/>
  <rect x="48" y="333" width="90" height="8" rx="3" fill="#CBD5E1"/>

  <!-- ── Network switch (bottom right) ──────────────────── -->
  <rect x="314" y="285" width="128" height="50" rx="10" fill="#E8F0FE"/>
  <rect x="314" y="285" width="128" height="18" rx="10" fill="#1B4DDB" fill-opacity="0.7"/>
  <!-- Port indicators -->
  <circle cx="327" cy="294" r="3.5" fill="#F58220"/>
  <circle cx="338" cy="294" r="3.5" fill="#F58220"/>
  <circle cx="349" cy="294" r="3.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="360" cy="294" r="3.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="371" cy="294" r="3.5" fill="#F58220" fill-opacity="0.7"/>
  <circle cx="382" cy="294" r="3.5" fill="rgba(255,255,255,0.4)"/>
  <!-- RJ45 port rows -->
  <rect x="322" y="308" width="16" height="12" rx="2" fill="rgba(13,38,101,0.15)"/>
  <rect x="344" y="308" width="16" height="12" rx="2" fill="rgba(13,38,101,0.15)"/>
  <rect x="366" y="308" width="16" height="12" rx="2" fill="rgba(13,38,101,0.15)"/>
  <rect x="388" y="308" width="16" height="12" rx="2" fill="rgba(13,38,101,0.15)"/>

  <!-- ── Connecting cable lines ─────────────────────────── -->
  <path d="M166 312 Q220 312 220 270" stroke="#1B4DDB" stroke-width="2" fill="none" stroke-opacity="0.25" stroke-dasharray="6,4"/>
  <path d="M314 312 Q270 312 270 270" stroke="#1B4DDB" stroke-width="2" fill="none" stroke-opacity="0.25" stroke-dasharray="6,4"/>

  <!-- ── Decorative check badges ─────────────────────────── -->
  <!-- Badge 1 — top right -->
  <rect x="380" y="36" width="72" height="72" rx="16" fill="#0D2665"/>
  <circle cx="416" cy="72" r="20" fill="none" stroke="#F58220" stroke-width="2"/>
  <polyline points="407,72 414,79 426,64" stroke="#F58220" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Badge 2 — left -->
  <rect x="8" y="140" width="60" height="60" rx="14" fill="#1B4DDB"/>
  <circle cx="38" cy="170" r="16" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5"/>
  <polyline points="30,170 37,177 46,162" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>

  <!-- Year badge — bottom centre -->
  <rect x="194" y="338" width="92" height="32" rx="16" fill="#0D2665"/>
  <text x="240" y="359" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SINCE 2018</text>
</svg>